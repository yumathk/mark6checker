<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mark Six Pattern Generator</title>
<style>
body { font-family: Arial; padding: 20px; }
input[type="text"] { width: 400px; }
input[type="number"] { width: 80px; }
button { padding: 8px 16px; margin-top: 10px; margin-bottom: 10px; }
table { border-collapse: collapse; width: 100%; margin-top: 10px; }
th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
th { background: #eee; }
.resultsTableScroll { height: auto; overflow: auto; }
.resultsTableScroll table { margin-top: 0; }
.resultsTableScroll th { position: sticky; top: 0; z-index: 1; }
.rangeBox { margin-bottom: 10px; }
pre { background: #f0f0f0; padding: 10px; }
.numberButton { padding: 3px 7px; margin: 2px; cursor: pointer; }
.numberButton small { display: block; font-size: 10px; font-weight: normal; color: #555; }
#numberStatsOutput { margin-top: 10px; }
#freqBoard { margin-top: 12px; }
.freqNote { font-size: 13px; color: #444; margin: 6px 0; }
.freqFilters button { margin-right: 6px; }
.freqTable { width: auto; min-width: 640px; }
.freqTable td, .freqTable th { text-align: center; }
.freqTable tr.warn { background: #fff3cd; }
.freqTable tr.bothHot { background: #ffd6d6; }
.freqTable tr.bothCold { background: #d6e9ff; }
.freqTable tr.rising { background: #e5f6e8; }
.freqTable tr.potential { background: #d9f2c8; }
.potentialBox { margin: 8px 0; padding: 8px; background: #eefbe8; border: 1px solid #8bc34a; }
.delta.down { color: #b03; font-weight: 700; }
.delta.up { color: #0a6b3a; font-weight: 700; }
td.stale { color: #b03; font-weight: 700; }
td.fresh { color: #0a6b3a; font-weight: 700; }
.warnBox { margin: 8px 0; padding: 8px; background: #fff8e6; border: 1px solid #ffe0a3; }
.resultNumberCell { padding: 0; text-align: center; }
.resultNumber { display: block; width: 100%; padding: 6px 8px; margin: 0; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
.resultNumber:hover { background: #f0f0f0; }
.resultNumber[aria-pressed="true"] { background: #ffe082; color: #222; font-weight: bold; }
.resultNumber:focus-visible { outline: 2px solid #147d92; outline-offset: -2px; }
</style>
</head>
<body>

<h2>📌 Step 1：讀取 GitHub JSON（results.json）</h2>
<input id="jsonUrl" type="text" placeholder="https://raw.githubusercontent.com/you/repo/main/results.json" value="https://raw.githubusercontent.com/yumathk/mark6checker/refs/heads/main/results.json">
<br>
<button onclick="loadJson()">讀取 JSON</button>
<div id="parsedOutput"></div>

<hr>

<h2>📌 Step 2：設定冷熱門檻並計算</h2>
Hot ≥ <input id="hotTh" type="number" value="5">
Cold ≤ <input id="coldTh" type="number" value="3">
<br>
<button onclick="calcHotCold()">計算冷熱</button>
<div id="hotcoldOutput"></div>

<h3>趨勢冷熱（最新 15 期 vs 前 15 期）</h3>
趨勢熱 ≥ <input id="trendHotTh" type="number" value="2">
趨勢冷 ≤ <input id="trendColdTh" type="number" value="2">
<br>
<button onclick="calcTrend()">計算趨勢冷熱</button>
<div id="trendOutput"></div>
<div id="intersectionOutput"></div>
<div id="freqBoard"></div>
<div id="numberStatsOutput"></div>

<hr>

<h2>📌 Step 3：設定區間</h2>
<div class="rangeBox">
Range A：<input id="a1" type="number" value="1"> – <input id="a2" type="number" value="20">
</div>
<div class="rangeBox">
Range B：<input id="b1" type="number" value="31"> – <input id="b2" type="number" value="40">
</div>
<button onclick="calcRanges()">計算區間熱度</button>
<div id="rangeOutput"></div>

<hr>

<h2>📌 Step 4：Pattern + 實際號碼生成器</h2>

<label for="poolType">使用號碼池：</label>
<select id="poolType">
  <option value="standard">標準冷熱</option>
  <option value="trend">趨勢冷熱</option>
  <option value="confirmed">雙重確認（熱/熱 + 冷/冷）</option>
</select>
<br>
<label for="excludeNumbers">排除號碼：</label>
<input id="excludeNumbers" type="text" placeholder="例如：5, 12, 28">

<h3>前 N 注（進取）</h3>
前注數 N：<input id="frontN" type="number" value="20"><br>
Range A：<input id="faH" type="number" value="2"> 熱 + <input id="faC" type="number" value="1"> 冷  
<br>
Range B：<input id="fbH" type="number" value="2"> 熱 + <input id="fbC" type="number" value="1"> 冷  

<h3>後 M 注（防守）</h3>
後注數 M：<input id="backM" type="number" value="20"><br>
Range A：<input id="saH" type="number" value="1"> 熱 + <input id="saC" type="number" value="2"> 冷  
<br>
Range B：<input id="sbH" type="number" value="1"> 熱 + <input id="sbC" type="number" value="2"> 冷  

<br><br>
<button onclick="genPattern()">生成 N+M 注</button>
<pre id="patternOutput"></pre>

<script>
let results = [];
let hot = [], cold = [], mid = [];
let trendHot = [], trendCold = [], trendMid = [];
let hotHot = [], coldCold = [];
let freqFilter = "decision";

// Utility: random pick
function pick(arr, count) {
  let out = [];
  let copy = [...arr];
  for (let i = 0; i < count && copy.length > 0; i++) {
    let idx = Math.floor(Math.random() * copy.length);
    out.push(copy[idx]);
    copy.splice(idx, 1);
  }
  return out;
}

function pickWithFallback(primary, count, fallback, used = []) {
  const available = [...new Set([...primary, ...fallback])]
    .filter(number => !used.includes(number));
  return pick(available, count);
}

function clickableNumbers(numbers) {
  return numbers.length
    ? numbers.map(number => `<button class="numberButton" onclick="showNumberStats(${number})">${number}</button>`).join("")
    : "（無）";
}

function countNumber(numbers, target) {
  return numbers.reduce((count, number) => count + (number === target ? 1 : 0), 0);
}

function showNumberStats(number) {
  const latest30 = results.slice(0, 30);
  const latest15 = results.slice(0, 15);
  const previous15 = results.slice(15, 30);
  const countInResults = group => group.reduce(
    (count, result) => count + countNumber(result.numbers, number) + (result.special === number ? 1 : 0), 0
  );

  document.getElementById("numberStatsOutput").innerHTML =
    `<pre>號碼 ${number}\n\n` +
    `最新 30 期：${countInResults(latest30)} 次\n` +
    `最新 15 期：${countInResults(latest15)} 次\n` +
    `前 15 期：${countInResults(previous15)} 次</pre>`;
}

// Step 1：讀取 JSON
function highlightResultNumber(number) {
  const buttons = document.querySelectorAll("#parsedOutput .resultNumber");
  const selected = document.querySelector(`#parsedOutput .resultNumber[data-number="${number}"]`);
  const clear = selected && selected.getAttribute("aria-pressed") === "true";
  buttons.forEach(button => {
    button.setAttribute("aria-pressed", String(!clear && Number(button.dataset.number) === number));
  });
}

function resultNumberCell(number) {
  return `<td class="resultNumberCell"><button type="button" class="resultNumber" data-number="${number}" aria-pressed="false" onclick="highlightResultNumber(${number})">${number}</button></td>`;
}

async function loadJson() {
  const url = document.getElementById("jsonUrl").value;
  const out = document.getElementById("parsedOutput");
  out.innerHTML = "";
  try {
    const res = await fetch(url);
    let full = await res.json();

    // ⭐ 只取前 30 行
    results = full.slice(0, 30);
    hot = []; cold = []; mid = [];
    trendHot = []; trendCold = []; trendMid = [];
    hotHot = []; coldCold = [];
    document.getElementById("freqBoard").innerHTML = "";

    let html = '<h3>所有歷史結果</h3><div class="resultsTableScroll" tabindex="0" role="region" aria-label="所有歷史結果"><table><thead><tr><th>#</th><th>Date</th>' +
      Array.from({ length: 6 }, (_, index) => `<th>Number ${index + 1}</th>`).join("") +
      "<th>Special</th></tr></thead><tbody>";
    full.forEach((r, index) => {
      html += `<tr><td>${index}</td><td>${r.date}</td>${r.numbers.map(resultNumberCell).join("")}${resultNumberCell(r.special)}</tr>`;
    });
    html += "</tbody></table></div>";
    out.innerHTML = html;
  } catch (e) {
    out.innerHTML = "<pre>❌ 無法讀取 JSON：" + e + "</pre>";
  }
}

// Step 2：冷熱計算
function calcHotCold() {
  if (!results.length) return alert("⚠️ 尚未載入 JSON");

  let freq = Array(50).fill(0);
  results.forEach(r => [...r.numbers, r.special].forEach(n => freq[n]++));

  const hotTh = parseInt(document.getElementById("hotTh").value);
  const coldTh = parseInt(document.getElementById("coldTh").value);

  hot = []; cold = []; mid = [];
  for (let i = 1; i <= 49; i++) {
    if (freq[i] >= hotTh) hot.push(i);
    else if (freq[i] <= coldTh) cold.push(i);
    else mid.push(i);
  }

  document.getElementById("hotcoldOutput").innerHTML =
    `<div><strong>🔥 熱碼：</strong>${clickableNumbers(hot)}</div>` +
    `<div><strong>❄️ 冷碼：</strong>${clickableNumbers(cold)}</div>` +
    `<div><strong>中間碼：</strong>${clickableNumbers(mid)}</div>`;

  updateIntersections();
}

function calcTrend() {
  if (results.length < 30) return alert("⚠️ 趨勢分析需要至少 30 期結果");

  const recentFreq = Array(50).fill(0);
  const previousFreq = Array(50).fill(0);

  results.slice(0, 15).forEach(r => [...r.numbers, r.special].forEach(n => recentFreq[n]++));
  results.slice(15, 30).forEach(r => [...r.numbers, r.special].forEach(n => previousFreq[n]++));

  const trendHotTh = parseInt(document.getElementById("trendHotTh").value, 10);
  const trendColdTh = parseInt(document.getElementById("trendColdTh").value, 10);

  trendHot = []; trendCold = []; trendMid = [];
  for (let i = 1; i <= 49; i++) {
    const change = recentFreq[i] - previousFreq[i];
    if (change >= trendHotTh) trendHot.push(i);
    else if (change <= -trendColdTh) trendCold.push(i);
    else trendMid.push(i);
  }

  document.getElementById("trendOutput").innerHTML =
    `<div><strong>📈 趨勢熱碼：</strong>${clickableNumbers(trendHot)}</div>` +
    `<div><strong>📉 趨勢冷碼：</strong>${clickableNumbers(trendCold)}</div>` +
    `<div><strong>趨勢中性碼：</strong>${clickableNumbers(trendMid)}</div>`;

  updateIntersections();
}

function numberFreq(number) {
  const countIn = group => group.reduce(
    (count, result) => count + countNumber(result.numbers, number) + (result.special === number ? 1 : 0), 0
  );
  const c30 = countIn(results.slice(0, 30));
  const c10 = countIn(results.slice(0, 10));
  const c15 = countIn(results.slice(0, 15));
  const prev = countIn(results.slice(15, 30));
  return { c30, c10, c11: c15 - c10, c15, prev, change: c15 - prev };
}

function trendReady() {
  return trendHot.length + trendCold.length + trendMid.length > 0;
}

function classifyNumber(number) {
  const standard = hot.includes(number) ? "熱" : cold.includes(number) ? "冷" : (hot.length || cold.length ? "中" : "—");
  const trend = !trendReady() ? "—" : trendHot.includes(number) ? "熱" : trendCold.includes(number) ? "冷" : "中";
  const freq = numberFreq(number);
  const growing = standard !== "熱" && standard !== "—" && freq.c10 > 0 && freq.c15 > freq.prev && freq.c15 >= 3 && (freq.c15 >= freq.c30 || trend === "熱");
  let verdict = "—";
  let rowClass = "";
  if (standard === "熱" && trend === "熱") { verdict = "雙熱"; rowClass = "bothHot"; }
  else if (standard === "冷" && trend === "冷") { verdict = "雙冷"; rowClass = "bothCold"; }
  else if (standard === "熱" && trend === "冷") { verdict = "熱但轉弱"; rowClass = "warn"; }
  else if (standard === "冷" && trend === "熱") { verdict = "冷但轉強"; rowClass = "rising"; }
  else if (standard === "熱" && trend === "中") { verdict = "熱未確認"; rowClass = "warn"; }
  else if (growing) { verdict = "潛力上升"; rowClass = "potential"; }
  return { standard, trend, verdict, rowClass };
}

function clickableNumbersWithFreq(numbers) {
  return numbers.length
    ? numbers.map(number => {
        const freq = numberFreq(number);
        const title = `30期 ${freq.c30}，近10期 ${freq.c10}，第11–15期 ${freq.c11}，近15期 ${freq.c15}，前15期 ${freq.prev}，變化 ${freq.change}`;
        return `<button class="numberButton" title="${title}" onclick="showNumberStats(${number})">${number}<small>${freq.c30}/${freq.c10}+${freq.c11}/${freq.prev}</small></button>`;
      }).join("")
    : "（無）";
}

function comb(n, k) {
  if (k < 0 || n < k) return 0;
  let value = 1;
  for (let i = 1; i <= k; i++) value = value * (n - k + i) / i;
  return value;
}

function setFreqFilter(value) {
  freqFilter = value;
  renderFreqBoard();
}

function renderFreqBoard() {
  const board = document.getElementById("freqBoard");
  if (!results.length) {
    board.innerHTML = "";
    return;
  }

  const rows = Array.from({ length: 49 }, (_, index) => {
    const number = index + 1;
    return { number, ...numberFreq(number), ...classifyNumber(number) };
  });
  const fading = rows.filter(row => row.verdict === "熱但轉弱");
  const unconfirmed = rows.filter(row => row.verdict === "熱未確認");
  const potential = rows.filter(row => row.verdict === "潛力上升");
  const rank = { "熱但轉弱": 0, "熱未確認": 1, "雙熱": 2, "潛力上升": 3, "冷但轉強": 4, "雙冷": 5 };
  const visible = rows
    .filter(row => !trendReady() || freqFilter === "all" || rank[row.verdict] !== undefined)
    .sort((a, b) => (rank[a.verdict] ?? 9) - (rank[b.verdict] ?? 9) || a.change - b.change || b.c15 - a.c15 || a.number - b.number);

  const deltaText = change => {
    const css = change > 0 ? "up" : change < 0 ? "down" : "";
    const sign = change > 0 ? "+" : "";
    return `<span class="delta ${css}">${sign}${change}</span>`;
  };
  const recentCell = row => {
    if (row.c15 > 0 && row.c10 === 0) return `<td class="stale">${row.c10}</td><td>${row.c11}</td>`;
    if (row.c15 > 0 && row.c10 === row.c15) return `<td class="fresh">${row.c10}</td><td>${row.c11}</td>`;
    return `<td>${row.c10}</td><td>${row.c11}</td>`;
  };
  const body = visible.map(row =>
    `<tr class="${row.rowClass}"><td>${row.number}</td><td>${row.c30}</td>${recentCell(row)}<td>${row.c15}</td><td>${row.prev}</td><td>${deltaText(row.change)}</td><td>${row.standard}</td><td>${row.trend}</td><td>${row.verdict}</td></tr>`
  ).join("");
  const falseCold = fading.filter(row => row.c15 > 0 && row.c10 === row.c15).map(row => row.number);
  const trueCold = fading.filter(row => row.c10 === 0).map(row => row.number);

  board.innerHTML =
    `<div class="potentialBox"><strong>未達熱門檻，但近期在升：</strong>${clickableNumbersWithFreq(potential.map(row => row.number))}` +
    `<div class="freqNote">30期還未算熱，但近15期多過前15期，近10期仍有出現，而且近15期包住全部30期次數，或已被標成趨勢熱。例如 30期 4、近15期 4、近10期 2。</div></div>` +
    `<div class="warnBox"><strong>標準熱但趨勢轉弱（不會入雙熱）：</strong>${clickableNumbersWithFreq(fading.map(row => row.number))}` +
    `<div class="freqNote">小字是 30期 / 近10期+第11–15期 / 前15期。近15期有次數，但最近10期是 0，先算真轉弱。如果 3 次全部在最近 10 期，15 期合計仍會當轉弱，但近期其實已回暖。</div>` +
    (trueCold.length ? `<div class="freqNote">近15期的次數全部在第11–15期：${trueCold.join(", ")}</div>` : "") +
    (falseCold.length ? `<div class="freqNote">近15期的次數全部在最近10期，轉弱標籤偏舊：${falseCold.join(", ")}</div>` : "") +
    `</div>` +
    (unconfirmed.length ? `<div class="freqNote">標準熱但趨勢中性：${clickableNumbersWithFreq(unconfirmed.map(row => row.number))}</div>` : "") +
    `<div class="freqNote">雙熱 ${hotHot.length} 個，5 膽可組 ${comb(hotHot.length, 5)} 組。雙冷 ${coldCold.length} 個，5 膽可組 ${comb(coldCold.length, 5)} 組。</div>` +
    `<div class="freqFilters">` +
    `<button type="button" onclick="setFreqFilter('decision')">只看決策號碼</button>` +
    `<button type="button" onclick="setFreqFilter('all')">全部 1–49</button>` +
    `</div>` +
    `<div class="resultsTableScroll"><table class="freqTable"><thead><tr><th>號碼</th><th>30期</th><th>近10</th><th>11–15</th><th>近15</th><th>前15</th><th>變化</th><th>標準</th><th>趨勢</th><th>判斷</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

function updateIntersections() {
  hotHot = hot.filter(number => trendHot.includes(number));
  coldCold = cold.filter(number => trendCold.includes(number));

  document.getElementById("intersectionOutput").innerHTML =
    `<div><strong>🌱 潛力上升（未達熱，但在升）：</strong>${clickableNumbersWithFreq(Array.from({ length: 49 }, (_, index) => index + 1).filter(number => classifyNumber(number).verdict === "潛力上升"))}</div>` +
    `<div><strong>🔥🔥 標準熱 ∩ 趨勢熱：</strong>${clickableNumbersWithFreq(hotHot)}</div>` +
    `<div><strong>❄️❄️ 標準冷 ∩ 趨勢冷：</strong>${clickableNumbersWithFreq(coldCold)}</div>` +
    `<div class="freqNote">按鈕下是 30期 / 近10期+第11–15期 / 前15期。近10期綠色代表近15期的次數全在最近10期；紅色 0 代表近15期的次數全部已過期。</div>`;
  renderFreqBoard();
}

// Step 3：區間熱度
function calcRanges() {
  if (!results.length) return alert("⚠️ 尚未載入 JSON");
  const a1 = parseInt(document.getElementById("a1").value);
  const a2 = parseInt(document.getElementById("a2").value);
  const b1 = parseInt(document.getElementById("b1").value);
  const b2 = parseInt(document.getElementById("b2").value);
  let rangeA = 0, rangeB = 0;
  results.forEach(r => r.numbers.forEach(n => {
    if (n >= a1 && n <= a2) rangeA++;
    if (n >= b1 && n <= b2) rangeB++;
  }));
  document.getElementById("rangeOutput").innerHTML =
    `<pre>Range A (${a1}-${a2})：${rangeA}\nRange B (${b1}-${b2})：${rangeB}</pre>`;
}

// Step 4：Pattern + 實際號碼生成（純文字）
function genPattern() {
  const poolType = document.getElementById("poolType").value;
  const excludeText = document.getElementById("excludeNumbers").value.trim();
  const excludeParts = excludeText ? excludeText.split(",").map(value => value.trim()) : [];
  const invalidExclude = excludeParts.find(value => !/^\d+$/.test(value) || Number(value) < 1 || Number(value) > 49);
  if (invalidExclude !== undefined) {
    return alert(`⚠️ 無效排除號碼：${invalidExclude || "空白"}。請用逗號分隔 1 至 49。`);
  }

  const excluded = new Set(excludeParts.map(Number));
  const withoutExcluded = numbers => numbers.filter(number => !excluded.has(number));
  const selectedHot = withoutExcluded(poolType === "trend" ? trendHot
                    : poolType === "confirmed" ? hotHot : hot);
  const selectedCold = withoutExcluded(poolType === "trend" ? trendCold
                     : poolType === "confirmed" ? coldCold : cold);

  if (!selectedHot.length && !selectedCold.length) {
    if (poolType === "confirmed") {
      return alert("⚠️ 請先計算標準及趨勢冷熱池");
    }
    return alert(poolType === "trend" ? "⚠️ 請先計算趨勢冷熱池" : "⚠️ 請先計算冷熱池");
  }

  const frontN = parseInt(document.getElementById("frontN").value);
  const backM = parseInt(document.getElementById("backM").value);
  const total = frontN + backM;

  const faH = parseInt(document.getElementById("faH").value);
  const faC = parseInt(document.getElementById("faC").value);
  const fbH = parseInt(document.getElementById("fbH").value);
  const fbC = parseInt(document.getElementById("fbC").value);

  const saH = parseInt(document.getElementById("saH").value);
  const saC = parseInt(document.getElementById("saC").value);
  const sbH = parseInt(document.getElementById("sbH").value);
  const sbC = parseInt(document.getElementById("sbC").value);

  const a1 = parseInt(document.getElementById("a1").value);
  const a2 = parseInt(document.getElementById("a2").value);
  const b1 = parseInt(document.getElementById("b1").value);
  const b2 = parseInt(document.getElementById("b2").value);

  const hotA = selectedHot.filter(n => n >= a1 && n <= a2);
  const coldA = selectedCold.filter(n => n >= a1 && n <= a2);
  const hotB = selectedHot.filter(n => n >= b1 && n <= b2);
  const coldB = selectedCold.filter(n => n >= b1 && n <= b2);
  const fallbackPool = withoutExcluded(poolType === "trend" ? trendMid : mid);
  const midA = fallbackPool.filter(n => n >= a1 && n <= a2);
  const midB = fallbackPool.filter(n => n >= b1 && n <= b2);

  let out = "";

  for (let i = 1; i <= total; i++) {
    const isFront = i <= frontN;
    const aHotCount = isFront ? faH : saH;
    const aColdCount = isFront ? faC : saC;
    const bHotCount = isFront ? fbH : sbH;
    const bColdCount = isFront ? fbC : sbC;

    const aHot = pickWithFallback(hotA, aHotCount, midA);
    const aCold = pickWithFallback(coldA, aColdCount, midA, aHot);
    const A = aHot.concat(aCold);

    const bHot = pickWithFallback(hotB, bHotCount, midB, A);
    const bCold = pickWithFallback(coldB, bColdCount, midB, A.concat(bHot));
    const B = bHot.concat(bCold);

    let nums = A.concat(B).sort((a,b)=>a-b);

    const fallbackNumbers = [...new Set([
      ...midA, ...midB,
      ...Array.from({ length: 49 }, (_, index) => index + 1)
    ])].filter(number => {
      const inRangeA = number >= a1 && number <= a2;
      const inRangeB = number >= b1 && number <= b2;
      return (inRangeA || inRangeB) && !excluded.has(number) && !nums.includes(number);
    });
    if (nums.length < 6) {
      nums = nums.concat(pick(fallbackNumbers, 6 - nums.length)).sort((a,b)=>a-b);
    }

    out += `${i}: ${nums.join(", ")}\n`;
  }

  document.getElementById("patternOutput").textContent = out;
}
</script>
