<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>注單比對工具 — 含固定派彩總額</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;margin:18px;background:#f7f8fb;color:#111}
    .container{max-width:980px;margin:0 auto;background:#fff;padding:18px;border-radius:8px;box-shadow:0 6px 18px rgba(20,30,60,0.06)}
    h3{margin:6px 0 12px}
    label{display:block;margin:10px 0 6px;font-weight:600}
    textarea, input[type="text"]{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d6d9e6;border-radius:6px;font-size:14px}
    .row{display:flex;gap:12px;align-items:center;margin-top:12px}
    button{padding:10px 14px;border-radius:6px;border:0;background:#0b79ff;color:#fff;font-weight:700;cursor:pointer}
    .results{margin-top:16px}
    .line{padding:8px 10px;border-radius:6px;border:1px solid #eef1fb;margin-bottom:8px;display:flex;align-items:center;gap:12px;background:#fbfdff}
    .nums{display:flex;gap:6px;flex-wrap:wrap}
    .num{min-width:34px;height:34px;line-height:34px;border-radius:6px;background:#f1f4fb;color:#223;padding:0 8px;text-align:center;font-weight:700}
    .num.match{background:linear-gradient(180deg,#1ec27a,#0aa05a);color:#fff;box-shadow:0 4px 10px rgba(10,160,90,0.12)}
    .num.special{background:linear-gradient(180deg,#ffb74d,#ff9800);color:#fff;box-shadow:0 4px 10px rgba(255,150,0,0.12)}
    .meta{margin-left:auto;text-align:right;font-size:13px;color:#334;min-width:180px}
    .meta .count{font-weight:800;color:#0b79ff}
    .prize{font-weight:800;color:#b03}
    .note{margin-top:12px;font-size:13px;color:#556}
    .small{font-size:12px;color:#7a8596}
    .controls{display:flex;gap:8px;margin-top:12px}
    .controls button.secondary{background:#eef2ff;color:#0b4bd6;border:1px solid #d7e0ff}
    .clear{background:#fff;color:#d23;border:1px solid #ffd6d6}
    .summary{margin-top:12px;padding:10px;border-radius:8px;background:#f7fbf7;border:1px solid #e6f4ea;color:#0a6b3a;font-weight:700}
    .export-note{margin-top:8px;font-size:13px;color:#556}
  </style>
</head>
<body>
  <div class="container">
    <h3>注單比對工具（含固定派彩總額）</h3>

    <label>貼上 N 注（每注一行，支援行首編號自動移除，例如：<span class="small">01: 11,12,13,14,15,16 或 1. 01 03 07 12 19 25</span>）</label>
    <textarea id="bets" rows="8" placeholder="每行一注，例如：&#10;01: 11,12,14,20,31,43&#10;1. 01 03 07 12 19 25"></textarea>

    <label>今期 7 個號碼（主號 6 + 特別號 1，逗號或空格分隔）</label>
    <input id="draw" type="text" placeholder="例如：1, 6, 37, 41, 45, 47, 8">

    <div class="row">
      <div style="flex:0 0 220px">
        <button id="checkBtn">Check</button>
      </div>
      <div style="flex:1">
        <div class="controls">
          <button id="clearBtn" class="secondary clear">Clear All</button>
          <button id="exampleBtn" class="secondary">Load Example</button>
          <button id="exportBtn" class="secondary">Export Results</button>
        </div>
      </div>
    </div>

    <div class="note">系統會自動移除每行開頭的行號或編號符號，然後抽出 1–49 的整數進行比對。每注會顯示命中數、獎項與固定派彩（若適用）。</div>

    <div id="results" class="results" aria-live="polite"></div>

    <div id="summaryBox" class="summary" style="display:none"></div>
    <div class="export-note">匯出會包含每注結果與固定派彩總額。</div>
  </div>

  <script>
    const LEADING_INDEX_RE = /^\s*\d{1,3}\s*[:\.\)\-–—]\s*/;

    function normalizeLine(line){
      return line.replace(LEADING_INDEX_RE, '').trim();
    }

    function parseNumbersFromText(text){
      const raw = text.match(/\d{1,2}/g) || [];
      const nums = raw.map(s => parseInt(s,10)).filter(n => n>=1 && n<=49);
      const seen = new Set();
      const uniq = [];
      for(const n of nums){
        if(!seen.has(n)){ seen.add(n); uniq.push(n); }
      }
      return uniq;
    }

    function determinePrize(mainMatches, specialHit){
      if(mainMatches === 6){
        return {name: '頭獎', fixedPayout: null};
      }
      if(mainMatches === 5 && specialHit){
        return {name: '二獎 (5.5)', fixedPayout: null};
      }
      if(mainMatches === 5){
        return {name: '三獎', fixedPayout: null};
      }
      if(mainMatches === 4 && specialHit){
        return {name: '四獎 (4.5)', fixedPayout: 9600};
      }
      if(mainMatches === 4){
        return {name: '五獎', fixedPayout: 640};
      }
      if(mainMatches === 3 && specialHit){
        return {name: '六獎 (3.5)', fixedPayout: 320};
      }
      if(mainMatches === 3){
        return {name: '七獎', fixedPayout: 40};
      }
      return {name: '未中獎', fixedPayout: null};
    }

    function renderResults(betsLines, drawNums){
      const resultsEl = document.getElementById('results');
      const summaryBox = document.getElementById('summaryBox');
      resultsEl.innerHTML = '';
      summaryBox.style.display = 'none';
      summaryBox.innerHTML = '';

      const mainDraw = drawNums.slice(0,6);
      const special = drawNums[6] !== undefined ? drawNums[6] : null;

      // header
      const header = document.createElement('div');
      header.className = 'line';
      header.style.background = '#fff8e6';
      header.style.border = '1px solid #fff0d1';
      header.innerHTML = '<div style="font-weight:800">Draw</div><div class="nums" style="margin-left:12px"></div><div class="meta small">Main: ' + mainDraw.join(', ') + (special ? ' &nbsp; | &nbsp; Special: ' + special : '') + '</div>';
      const numsContainer = header.querySelector('.nums');
      for(const n of mainDraw){
        const span = document.createElement('div');
        span.className = 'num';
        span.textContent = String(n).padStart(2,'0');
        numsContainer.appendChild(span);
      }
      if(special !== null){
        const s = document.createElement('div');
        s.className = 'num special';
        s.textContent = String(special).padStart(2,'0');
        numsContainer.appendChild(s);
      }
      resultsEl.appendChild(header);

      // accumulate fixed payouts
      let totalFixedPayout = 0;
      let fixedPayoutCount = 0;
      let totalWinningLines = 0;

      // render each bet line
      betsLines.forEach((rawLine, idx) => {
        const displayLine = rawLine.replace(LEADING_INDEX_RE, '').trim();
        const nums = parseNumbersFromText(displayLine);
        const lineEl = document.createElement('div');
        lineEl.className = 'line';
        const numsWrap = document.createElement('div');
        numsWrap.className = 'nums';
        let mainMatchCount = 0;
        let specialHit = false;

        nums.forEach(n => {
          const span = document.createElement('div');
          span.className = 'num';
          span.textContent = String(n).padStart(2,'0');
          if(mainDraw.includes(n)){
            span.classList.add('match');
            mainMatchCount++;
          } else if(special !== null && n === special){
            span.classList.add('special');
            specialHit = true;
          }
          numsWrap.appendChild(span);
        });

        if(nums.length === 0){
          const p = document.createElement('div');
          p.className = 'small';
          p.textContent = '(此行未偵測到有效號碼)';
          numsWrap.appendChild(p);
        }

        const prize = determinePrize(mainMatchCount, specialHit);
        if(prize.fixedPayout !== null){
          totalFixedPayout += prize.fixedPayout;
          fixedPayoutCount++;
        }
        if(prize.name !== '未中獎') totalWinningLines++;

        const meta = document.createElement('div');
        meta.className = 'meta';
        let metaHtml = '<div>命中 <span class="count">' + mainMatchCount + '</span> / 6</div>';
        if(specialHit){
          metaHtml += '<div style="color:#ff8a00;font-weight:700">特別號命中</div>';
        }
        if(prize.name !== '未中獎'){
          metaHtml += '<div class="prize">' + prize.name + '</div>';
          if(prize.fixedPayout !== null){
            metaHtml += '<div class="small prize fixed">固定派彩：$' + prize.fixedPayout.toLocaleString() + '</div>';
          } else {
            metaHtml += '<div class="small">派彩視當期分配而定</div>';
          }
        } else {
          metaHtml += '<div class="small">未中獎</div>';
        }
        meta.innerHTML = metaHtml;

        lineEl.appendChild(numsWrap);
        lineEl.appendChild(meta);
        resultsEl.appendChild(lineEl);
      });

      // summary and total fixed payout
      const total = betsLines.length;
      const summary = document.createElement('div');
      summary.className = 'small';
      summary.style.marginTop = '8px';
      summary.textContent = '共檢查 ' + total + ' 注；中獎注數：' + totalWinningLines;
      resultsEl.appendChild(summary);

      // show fixed payout summary if any
      if(fixedPayoutCount > 0){
        summaryBox.style.display = 'block';
        summaryBox.innerHTML = '固定派彩注數：' + fixedPayoutCount + ' 注 &nbsp;｜&nbsp; 固定派彩總額：$' + totalFixedPayout.toLocaleString();
      } else {
        summaryBox.style.display = 'block';
        summaryBox.innerHTML = '固定派彩注數：0 注 &nbsp;｜&nbsp; 固定派彩總額：$0';
      }
    }

    // UI wiring
    document.getElementById('checkBtn').addEventListener('click', () => {
      const betsText = document.getElementById('bets').value.trim();
      const drawText = document.getElementById('draw').value.trim();
      if(!betsText){
        alert('請先貼上注單（每注一行）。');
        return;
      }
      if(!drawText){
        if(!confirm('你未輸入今期號碼，是否只顯示注單（不會標示命中）？')) return;
      }
      const lines = betsText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length>0);
      const drawNums = parseNumbersFromText(drawText);
      if(drawNums.length === 0){
        if(!confirm('你輸入的今期號碼無效或為空，是否繼續？')) return;
      }
      renderResults(lines, drawNums);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('bets').value = '';
      document.getElementById('draw').value = '';
      document.getElementById('results').innerHTML = '';
      document.getElementById('summaryBox').style.display = 'none';
      document.getElementById('summaryBox').innerHTML = '';
    });

    document.getElementById('exampleBtn').addEventListener('click', () => {
      const example = [
        '01: 11,12,14,20,31,43',
        '02: 12,15,31,33,35,47',
        '03: 14,20,31,32,34,41',
        '31: 01,03,07,12,19,25',
        '32: 02,04,06,11,20,29'
      ].join('\n');
      document.getElementById('bets').value = example;
      document.getElementById('draw').value = '3, 6, 7, 9, 20, 24, 13';
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const resultsEl = document.getElementById('results');
      const summaryBox = document.getElementById('summaryBox');
      if(!resultsEl.innerText.trim()){
        alert('目前無結果可匯出，請先按 Check。');
        return;
      }
      // build export text: include results area text + summaryBox
      const text = resultsEl.innerText + '\n\n' + (summaryBox.innerText || '');
      const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'check-results.txt';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    // Ctrl+Enter to run check
    document.getElementById('bets').addEventListener('keydown', (e) => {
      if(e.ctrlKey && e.key === 'Enter'){ document.getElementById('checkBtn').click(); }
    });
    document.getElementById('draw').addEventListener('keydown', (e) => {
      if(e.ctrlKey && e.key === 'Enter'){ document.getElementById('checkBtn').click(); }
    });
  </script>
</body>
</html>
