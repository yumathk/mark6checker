<!DOCTYPE html>
<html lang="zh-Hant" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mark Six Estimation</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<style>
.numbtn { border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; padding: 0 2px; }
.picked { outline: 2px solid #ffc107; background: #ffe082; color: #212529; }
#heatTable tr.selected-row > td, #historyTable tr.selected-row > td { box-shadow: inset 0 2px #ffc107, inset 0 -2px #ffc107; }
#heatTable tr.selected-row > td:first-child, #historyTable tr.selected-row > td:first-child { border-left: 2px solid #ffc107; }
#heatTable tr.selected-row > td:last-child, #historyTable tr.selected-row > td:last-child { border-right: 2px solid #ffc107; }
.numbtn.filter-hit { box-shadow: inset 0 0 0 2px #0d6efd; }
.numbtn.filter-hit:not(.picked) { background: #cfe2ff; color: #212529; }
#historyTable .numbtn { display: block; width: 100%; min-height: 1.75rem; border-radius: 4px; }
#historyTable tr.selected-row .numbtn:not(.picked):not(.filter-hit) { opacity: 0.45; }
.history-toolbar { position: sticky; top: 56px; z-index: 3; background: var(--bs-body-bg); }
#historyTable thead th { position: sticky; top: 0; z-index: 2; background-color: var(--bs-body-bg); }
.number-popover { max-width: 20rem; }
td.cold, td.mid, td.warm, td.hot, td.outside { color: #212529; }
td.cold { background-color: #9ec5f5 !important; }
td.mid { background-color: #495057 !important; color: #f8f9fa; }
td.warm { background-color: #ff9800 !important; color: #212529 !important; }
td.hot { background-color: #ff8a80 !important; font-weight: 700; }
.total-cold { background-color: #9ec5f5 !important; color: #212529 !important; }
.total-normal { background-color: #ffe082 !important; color: #212529 !important; }
.total-hot { background-color: #ff8a80 !important; color: #212529 !important; }
.total-legend { display: inline-block; padding: 2px 8px; border-radius: 4px; }
tr.dim td { color: #adb5bd; }
td.outside { background-color: #343a40 !important; color: #adb5bd; }
.up { color: #75b798 !important; font-weight: 700; }
.down { color: #ea868f !important; font-weight: 700; }
@media (max-width: 576px) {
  .table { font-size: 0.75rem; }
  .table th, .table td { padding: 0.2rem; white-space: nowrap; }
  .trend-table-scroll { max-height: 70vh; overflow: auto; }
  #heatTable thead th { position: sticky; top: 0; z-index: 2; background-color: var(--bs-body-bg); }
}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container-fluid">
    <span class="navbar-brand">估算</span>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="選單">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><button type="button" class="nav-link active" data-section="trend" onclick="showSection('trend')">每個號碼的 5 期走勢</button></li>
        <li class="nav-item"><button type="button" class="nav-link" data-section="windows" onclick="showSection('windows')">區間 × 5 期窗口</button></li>
        <li class="nav-item"><button type="button" class="nav-link" data-section="draws" onclick="showSection('draws')">每期區間分佈</button></li>
        <li class="nav-item"><button type="button" class="nav-link" data-section="history" onclick="showSection('history')">所有歷史結果</button></li>
        <li class="nav-item"><button type="button" class="nav-link" data-section="pairs" onclick="showSection('pairs')">號碼組合</button></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container-fluid py-3">
  <div class="input-group mb-2">
    <input id="jsonUrl" class="form-control" type="text" value="https://raw.githubusercontent.com/yumathk/mark6checker/refs/heads/main/results.json">
    <button class="btn btn-primary" type="button" onclick="loadJson()">讀取並估算</button>
  </div>
  <div id="status" class="small text-secondary mb-2"></div>
  <p class="small text-secondary">30 期合計：<span class="total-legend total-cold">0–3 冷</span> <span class="total-legend total-normal">4–5 正常</span> <span class="total-legend total-hot">6+ 熱</span>。每個號碼的五期格：<span class="total-legend total-cold">0–1 冷</span> <span class="total-legend total-normal">2–3 正常</span> <span class="total-legend total-hot">4–5 熱</span>。</p>

  <section id="windows" class="d-none" data-panel="windows">
    <h1 class="h5">區間 × 5 期窗口</h1>
    <div id="bandSummary"></div>
  </section>

  <section id="trend" data-panel="trend">
    <h1 class="h5">每個號碼的 5 期走勢</h1>
    <p class="small text-secondary">欄位是不重疊的 1–5、6–10 … 26–30。活躍度權重：6、5、4、3、2、1；趨勢分權重：+3、+2、+1、−1、−2、−3（由近至遠）。趨勢分正值偏近期、負值偏早期，並非下期機率。特別號計入。</p>
    <div id="attention" class="mb-3"></div>
    <div class="btn-group btn-group-sm flex-wrap mb-2" role="group">
      <button type="button" class="btn btn-outline-secondary active" data-sort="number" onclick="setSort('number')">號碼</button>
      <button type="button" class="btn btn-outline-secondary" data-sort="weight" onclick="setSort('weight')">活躍度</button>
      <button type="button" class="btn btn-outline-secondary" data-sort="trendScore" onclick="setSort('trendScore')">趨勢分</button>
      <button type="button" class="btn btn-outline-secondary" data-sort="recent" onclick="setSort('recent')">近5期</button>
      <button type="button" class="btn btn-outline-secondary" data-sort="c30" onclick="setSort('c30')">30期</button>
      <button type="button" class="btn btn-outline-secondary active" data-view="all" onclick="setView('all')">全部</button>
      <button type="button" class="btn btn-outline-secondary" data-view="focus" onclick="setView('focus')">只看要留意</button>
    </div>
    <div class="d-inline-flex align-items-center gap-2 mb-2 ms-sm-2">
      <span class="small text-nowrap" id="temperatureLabel">30期冷熱</span>
      <div class="btn-group btn-group-sm" role="group" aria-labelledby="temperatureLabel">
        <input type="checkbox" class="btn-check" id="filterCold" value="冷" checked onchange="setTemperature(this.value, this.checked)">
        <label class="btn btn-outline-primary" for="filterCold">冷</label>
        <input type="checkbox" class="btn-check" id="filterNormal" value="正常" checked onchange="setTemperature(this.value, this.checked)">
        <label class="btn btn-outline-warning" for="filterNormal">正常</label>
        <input type="checkbox" class="btn-check" id="filterHot" value="熱" checked onchange="setTemperature(this.value, this.checked)">
        <label class="btn btn-outline-danger" for="filterHot">熱</label>
      </div>
    </div>
    <div class="table-responsive trend-table-scroll">
      <table id="heatTable" class="table table-sm table-bordered align-middle text-center mb-0"></table>
    </div>
  </section>

  <section id="draws" class="d-none" data-panel="draws">
    <h1 class="h5">每期區間分佈（6 個正選 + 特別號 = 7）</h1>
    <div class="form-check mb-2">
      <input id="only30" class="form-check-input" type="checkbox" checked onchange="render()">
      <label class="form-check-label" for="only30">只顯示估算用的最新 30 期</label>
    </div>
    <div class="table-responsive">
      <table id="bandTable" class="table table-sm table-bordered align-middle text-center mb-0"></table>
    </div>
  </section>

  <section id="history" class="d-none" data-panel="history">
    <h1 class="h5">所有歷史結果</h1>
    <div class="history-toolbar pb-2">
      <div class="row g-2 align-items-end">
        <div class="col-auto">
          <label for="historyFilter" class="form-label small mb-1">搜尋號碼（1–49）</label>
          <input id="historyFilter" class="form-control form-control-sm" type="number" min="1" max="49" inputmode="numeric" placeholder="例如 40" oninput="renderHistory()">
        </div>
        <div class="col-auto">
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="clearHistoryFilter()">清除</button>
        </div>
      </div>
      <div id="historyStatus" class="small text-secondary mt-2">點擊號碼可在所有期數中高亮，並查看統計。搜尋後只顯示包含該號碼的日期。</div>
    </div>
    <div class="table-responsive trend-table-scroll">
      <table id="historyTable" class="table table-sm table-striped table-bordered align-middle text-center mb-0"></table>
    </div>
  </section>

  <section id="pairs" class="d-none" data-panel="pairs">
    <h1 class="h5">號碼組合（最新30期，含特別號）</h1>
    <div class="d-flex flex-wrap gap-3 align-items-end mb-3">
      <div>
        <label for="pairSize" class="form-label small">組合大小</label>
        <select id="pairSize" class="form-select form-select-sm" onchange="renderPairs()">
          <option value="2">2個號碼</option>
          <option value="3">3個號碼</option>
        </select>
      </div>
      <div>
        <label for="pairNumber" class="form-label small">包含號碼</label>
        <select id="pairNumber" class="form-select form-select-sm" onchange="renderPairs()">
          <option value="0">全部號碼</option>
        </select>
      </div>
      <div>
        <label for="pairPartner" class="form-label small">另一號碼</label>
        <select id="pairPartner" class="form-select form-select-sm" onchange="renderPairs()">
          <option value="0">全部號碼</option>
        </select>
      </div>
      <div id="pairThirdFilter" class="d-none">
        <label for="pairThird" class="form-label small">第三號碼</label>
        <select id="pairThird" class="form-select form-select-sm" disabled onchange="renderPairs()">
          <option value="0">全部號碼</option>
        </select>
      </div>
      <div>
        <label for="pairMinimum" class="form-label small">最少同出次數</label>
        <select id="pairMinimum" class="form-select form-select-sm" onchange="renderPairs()">
          <option value="0">0（包括未同出）</option>
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
    </div>
    <div id="pairStatus" class="small text-secondary mb-2" aria-live="polite"></div>
    <div class="table-responsive">
      <table id="pairTable" class="table table-sm table-bordered align-middle text-center mb-0"></table>
    </div>
    <div class="d-flex gap-2 mt-2">
      <button id="pairPrev" type="button" class="btn btn-sm btn-outline-secondary" disabled onclick="renderPairs(pairPage - 1)">上一頁</button>
      <button id="pairNext" type="button" class="btn btn-sm btn-outline-secondary" disabled onclick="renderPairs(pairPage + 1)">下一頁</button>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
const WINDOWS = [
  { label: "1–5", start: 0, end: 5, weight: 6 },
  { label: "6–10", start: 5, end: 10, weight: 5 },
  { label: "11–15", start: 10, end: 15, weight: 4 },
  { label: "16–20", start: 15, end: 20, weight: 3 },
  { label: "21–25", start: 20, end: 25, weight: 2 },
  { label: "26–30", start: 25, end: 30, weight: 1 }
];
const BANDS = [
  { label: "1–10", min: 1, max: 10 },
  { label: "11–20", min: 11, max: 20 },
  { label: "21–30", min: 21, max: 30 },
  { label: "31–40", min: 31, max: 40 },
  { label: "41–49", min: 41, max: 49 }
];

let full = [];
let draws = [];
let sortKey = "number";
let view = "all";
const temperatures = new Set(["冷", "正常", "熱"]);
let selected = null;
let pairPage = 1;
let numberPopover = null;

const pairOptions = Array.from({ length: 49 }, (_, index) => `<option value="${index + 1}">${index + 1}</option>`).join("");
document.getElementById("pairNumber").insertAdjacentHTML("beforeend", pairOptions);
document.getElementById("pairPartner").insertAdjacentHTML("beforeend", pairOptions);
document.getElementById("pairThird").insertAdjacentHTML("beforeend", pairOptions);

function ballsOf(result) {
  return [...result.numbers, result.special];
}
function bandSize(band) { return band.max - band.min + 1; }
function expectedBand(drawsInWindow, band) {
  return drawsInWindow * 7 * bandSize(band) / 49;
}
function heatClass(count) {
  if (count <= 1) return "total-cold";
  if (count <= 3) return "total-normal";
  return "total-hot";
}
function bandClass(count) {
  if (count <= 3) return "total-cold";
  if (count <= 6) return "total-normal";
  if (count <= 9) return "warm";
  return "total-hot";
}
function countIn(group, number) {
  return group.reduce((count, result) => count + (ballsOf(result).includes(number) ? 1 : 0), 0);
}
function numberRow(number) {
  const windows = WINDOWS.map(window => countIn(draws.slice(window.start, window.end), number));
  const c30 = windows.reduce((sum, count) => sum + count, 0);
  const c15 = windows[0] + windows[1] + windows[2];
  const prev = windows[3] + windows[4] + windows[5];
  const weight = windows.reduce((sum, count, index) => sum + count * WINDOWS[index].weight, 0);
  const trendWeights = [3, 2, 1, -1, -2, -3];
  const trendScore = windows.reduce((sum, count, index) => sum + count * trendWeights[index], 0);
  const gap = draws.findIndex(result => ballsOf(result).includes(number));
  return { number, windows, c30, c15, prev, change: c15 - prev, weight, trendScore, gap: gap === -1 ? draws.length : gap };
}
function standardOf(count) {
  if (count <= 3) return "冷";
  if (count >= 6) return "熱";
  return "正常";
}
function tagsFor(row) {
  const tags = [];
  const hotAbsent10 = row.standard === "熱" && row.windows[0] + row.windows[1] === 0;
  if (row.standard !== "冷" && row.windows[0] === 0 && !hotAbsent10) {
    tags.push(row.windows[1] === 0 ? "轉冷（近10期未出）" : "轉冷（近5期未出）");
  }
  if (row.windows[0] >= 4) tags.push("近5熱");
  if (hotAbsent10) tags.push("熱但近10未出");
  if (row.standard === "正常" && row.c15 > row.prev && row.windows[0] > 0 && row.c15 >= 3) tags.push("潛力上升");
  if (row.standard === "冷" && row.c15 > row.prev && row.windows[0] > 0) tags.push("冷但回升");
  return tags;
}
function verdictFor(row) {
  if (row.tags.includes("熱但近10未出")) return "熱但近10未出";
  if (row.tags.includes("轉冷（近10期未出）")) return `${row.standard}但轉冷（近10期未出）`;
  if (row.tags.includes("轉冷（近5期未出）")) return `${row.standard}但轉冷（近5期未出）`;
  if (row.tags.includes("冷但回升")) return "冷但回升";
  return [row.standard, ...row.tags].join("、");
}
function numCell(number, withPopover = false) {
  const picked = number === selected ? " picked" : "";
  const popoverAction = withPopover ? `; showNumberPopover(this, ${number})` : "";
  return `<button class="numbtn${picked}" data-number="${number}" aria-pressed="${number === selected}" onclick="pick(${number})${popoverAction}">${number}</button>`;
}
function pick(number) {
  selected = selected === number ? null : number;
  document.querySelectorAll(".numbtn[data-number]").forEach(button => {
    const active = Number(button.dataset.number) === selected;
    button.classList.toggle("picked", active);
    button.setAttribute("aria-pressed", String(active));
  });
  document.querySelectorAll("#heatTable tr[data-row-number]").forEach(row => {
    row.classList.toggle("selected-row", Number(row.dataset.rowNumber) === selected);
  });
  document.querySelectorAll("#historyTable tbody tr[data-numbers]").forEach(row => {
    const numbers = row.dataset.numbers.split(",").map(Number);
    row.classList.toggle("selected-row", selected !== null && numbers.includes(selected));
  });
}
function showSection(id) {
  closeNumberPopover();
  document.querySelectorAll("[data-panel]").forEach(panel => {
    panel.classList.toggle("d-none", panel.dataset.panel !== id);
  });
  document.querySelectorAll("#navMenu .nav-link").forEach(link => {
    link.classList.toggle("active", link.dataset.section === id);
  });
  const menu = document.getElementById("navMenu");
  if (menu.classList.contains("show")) bootstrap.Collapse.getOrCreateInstance(menu).hide();
  window.scrollTo(0, 0);
}
function setSort(value) {
  sortKey = value;
  document.querySelectorAll("[data-sort]").forEach(button => button.classList.toggle("active", button.dataset.sort === value));
  render();
}
function setView(value) {
  view = value;
  document.querySelectorAll("[data-view]").forEach(button => button.classList.toggle("active", button.dataset.view === value));
  render();
}
function setTemperature(value, checked) {
  if (checked) temperatures.add(value);
  else temperatures.delete(value);
  render();
}
function th(label, key) {
  return `<th onclick="setSort('${key}')">${label}${sortKey === key ? " ▼" : ""}</th>`;
}

async function loadJson() {
  const status = document.getElementById("status");
  status.textContent = "讀取中…";
  try {
    const response = await fetch(document.getElementById("jsonUrl").value);
    if (!response.ok) throw new Error(response.status + " " + response.statusText);
    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("JSON 不是陣列");
    full = data;
    draws = full.slice(0, 30);
    status.textContent = `已讀 ${full.length} 期，估算用最新 ${draws.length} 期` +
      (draws[0] ? `（${draws[0].date}）` : "");
    render();
  } catch (error) {
    status.innerHTML = "無法讀取 JSON：" + error + "。file:// 直接開頁時，瀏覽器可能擋住讀取。";
  }
}

function render() {
  if (!draws.length) return;
  const rows = Array.from({ length: 49 }, (_, index) => numberRow(index + 1))
    .map(row => ({ ...row, standard: standardOf(row.c30) }))
    .map(row => ({ ...row, tags: tagsFor(row) }));

  renderAttention(rows);
  renderHeat(rows);
  renderBands();
  renderHistory();
  renderPairs();
}

function combinations(numbers, size) {
  const groups = [];
  const collect = (start, group) => {
    if (group.length === size) {
      groups.push(group);
      return;
    }
    for (let index = start; index <= numbers.length - (size - group.length); index++) {
      collect(index + 1, [...group, numbers[index]]);
    }
  };
  collect(0, []);
  return groups;
}

function groupRows(size) {
  const counts = new Map();
  draws.slice(0, 30).forEach((result, index) => {
    const balls = [...new Set(ballsOf(result))].sort((first, second) => first - second);
    combinations(balls, size).forEach(numbers => {
      const key = numbers.join(",");
      const row = counts.get(key) || { count: 0, recent: 0 };
      row.count++;
      if (index < 15) row.recent++;
      counts.set(key, row);
    });
  });
  return combinations(Array.from({ length: 49 }, (_, index) => index + 1), size).map(numbers => {
    const row = counts.get(numbers.join(",")) || { count: 0, recent: 0 };
    return { numbers, ...row, previous: row.count - row.recent };
  });
}

function closeNumberPopover() {
  if (!numberPopover) return;
  numberPopover.instance.dispose();
  numberPopover = null;
}

function showNumberPopover(button, number) {
  const sameButton = numberPopover && numberPopover.button === button;
  closeNumberPopover();
  if (sameButton) return;
  const row = numberRow(number);
  row.standard = standardOf(row.c30);
  row.tags = tagsFor(row);
  const signed = value => value > 0 ? `+${value}` : String(value);
  const direction = value => value > 0 ? "up" : value < 0 ? "down" : "";
  const content = historySummary(number) +
    `<div class="mt-1">30期：<strong>${row.c30} 次（${row.standard}）</strong></div>` +
    `<div>趨勢分：<strong class="${direction(row.trendScore)}">${signed(row.trendScore)}</strong></div>` +
    `<div>近5 / 近10：<strong>${row.windows[0]} / ${row.windows[0] + row.windows[1]}</strong></div>` +
    `<div>近15 / 前15：<strong>${row.c15} / ${row.prev}</strong></div>` +
    `<div>變化：<strong class="${direction(row.change)}">${signed(row.change)}</strong></div>` +
    `<div>活躍度：<strong>${row.weight}</strong></div>` +
    `<div>判斷：<strong>${verdictFor(row)}</strong></div>`;
  const instance = new bootstrap.Popover(button, {
    title: `號碼 ${number}`,
    content,
    html: true,
    trigger: "manual",
    placement: "auto",
    container: "body",
    customClass: "number-popover"
  });
  numberPopover = { button, instance };
  instance.show();
}

document.addEventListener("click", event => {
  if (numberPopover && !numberPopover.button.contains(event.target) && !event.target.closest(".popover")) closeNumberPopover();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeNumberPopover();
});

function historyFilterNumber() {
  const raw = document.getElementById("historyFilter").value.trim();
  if (!raw) return { state: "all" };
  const number = Number(raw);
  if (!Number.isInteger(number) || number < 1 || number > 49) return { state: "invalid" };
  return { state: "number", number };
}

function clearHistoryFilter() {
  document.getElementById("historyFilter").value = "";
  renderHistory();
}

function historySummary(number) {
  if (!full.length) return "";
  let main = 0;
  let special = 0;
  let gap = null;
  let lastDate = null;
  let previous = null;
  const gaps = [];
  full.forEach((result, index) => {
    const inMain = result.numbers.includes(number);
    const inSpecial = result.special === number;
    if (!inMain && !inSpecial) return;
    if (inMain) main++;
    if (inSpecial) special++;
    if (gap === null) {
      gap = index;
      lastDate = result.date;
    }
    if (previous !== null) gaps.push(index - previous);
    previous = index;
  });
  const total = main + special;
  const rate = (total / full.length * 100).toFixed(1);
  const avg = gaps.length ? (gaps.reduce((sum, value) => sum + value, 0) / gaps.length).toFixed(1) : "—";
  const last = lastDate ? `${lastDate}（距今 ${gap} 期）` : "未出現";
  return `<div>全部 ${full.length} 期：<strong>${total} 次（${rate}%，期望約 14.3%）</strong></div>` +
    `<div>正選 / 特別號：<strong>${main} / ${special}</strong></div>` +
    `<div>最近出現：<strong>${last}</strong></div>` +
    `<div>平均間距：<strong>${avg} 期</strong></div>`;
}

function renderHistory() {
  const table = document.getElementById("historyTable");
  const status = document.getElementById("historyStatus");
  if (!full.length) {
    status.textContent = "尚未讀取結果。";
    table.innerHTML = "";
    return;
  }
  closeNumberPopover();
  const filter = historyFilterNumber();
  const shown = full.map((result, index) => ({ result, index })).filter(({ result }) => {
    if (filter.state !== "number") return true;
    return ballsOf(result).includes(filter.number);
  });
  if (filter.state === "invalid") {
    status.textContent = "請輸入 1–49 的整數。";
  } else if (filter.state === "number") {
    const main = full.filter(result => result.numbers.includes(filter.number)).length;
    const special = full.filter(result => result.special === filter.number).length;
    status.textContent = `號碼 ${filter.number}：${shown.length} / ${full.length} 期包含此號碼（正選 ${main}、特別號 ${special}）。下表只顯示這些日期。`;
  } else {
    status.textContent = `顯示全部 ${full.length} 期。點擊號碼可在所有期數中高亮，並查看統計。`;
  }
  const head = `<thead><tr><th>#</th><th>Date</th><th>Number 1</th><th>Number 2</th><th>Number 3</th><th>Number 4</th><th>Number 5</th><th>Number 6</th><th>Special</th></tr></thead>`;
  const body = shown.map(({ result, index }) => {
    const balls = ballsOf(result);
    const rowClass = selected !== null && balls.includes(selected) ? "selected-row" : "";
    const cells = Array.from({ length: 6 }, (_, cell) => result.numbers[cell])
      .map(number => historyNumberCell(number, filter))
      .join("");
    return `<tr class="${rowClass}" data-numbers="${balls.join(",")}"><td>${index}</td><td>${result.date}</td>${cells}${historyNumberCell(result.special, filter)}</tr>`;
  }).join("");
  const empty = filter.state === "number" ? `沒有期數包含 ${filter.number}` : "沒有結果";
  table.innerHTML = head + `<tbody>${body || `<tr><td colspan="9" class="text-secondary">${empty}</td></tr>`}</tbody>`;
}

function historyNumberCell(number, filter) {
  if (number == null) return "<td></td>";
  const html = numCell(number, true);
  const marked = filter.state === "number" && number === filter.number
    ? html.replace('class="numbtn', 'class="numbtn filter-hit')
    : html;
  return `<td>${marked}</td>`;
}

function renderPairs(page = 1) {
  closeNumberPopover();
  const size = Number(document.getElementById("pairSize").value);
  document.getElementById("pairThirdFilter").classList.toggle("d-none", size !== 3);
  document.getElementById("pairThird").disabled = size !== 3;
  if (!draws.length) return;
  const number = Number(document.getElementById("pairNumber").value);
  const partner = Number(document.getElementById("pairPartner").value);
  const third = size === 3 ? Number(document.getElementById("pairThird").value) : 0;
  const minimum = Number(document.getElementById("pairMinimum").value);
  const filters = [number, partner, third].filter(value => value > 0);
  const uniqueFilters = new Set(filters);
  const visible = groupRows(size)
    .filter(row => uniqueFilters.size === filters.length && filters.every(value => row.numbers.includes(value)) && row.count >= minimum)
    .sort((first, second) => second.count - first.count || second.recent - first.recent ||
      first.numbers[0] - second.numbers[0] || first.numbers[1] - second.numbers[1] || (first.numbers[2] || 0) - (second.numbers[2] || 0));
  const pages = Math.max(1, Math.ceil(visible.length / 100));
  pairPage = Math.min(pages, Math.max(1, page));
  document.getElementById("pairPrev").disabled = pairPage === 1;
  document.getElementById("pairNext").disabled = pairPage === pages;
  document.getElementById("pairStatus").textContent = `最新 ${Math.min(draws.length, 30)} 期：${visible.length} 組${size}號碼組合，第 ${pairPage} / ${pages} 頁`;
  const head = `<thead><tr><th>號碼</th><th>另一號碼</th>${size === 3 ? "<th>第三號碼</th>" : ""}<th>30期同出</th><th>近15</th><th>前15</th></tr></thead>`;
  const totals = Array.from({ length: 50 }, (_, number) => countIn(draws.slice(0, 30), number));
  const pairNumberCell = number => {
    const standard = standardOf(totals[number]);
    const css = standard === "熱" ? "total-hot" : standard === "冷" ? "total-cold" : "total-normal";
    return `<td class="${css}">${numCell(number, true)}</td>`;
  };
  const body = visible.slice((pairPage - 1) * 100, pairPage * 100).map(row => `<tr>${row.numbers.map(pairNumberCell).join("")}<td>${row.count}</td><td>${row.recent}</td><td>${row.previous}</td></tr>`).join("");
  document.getElementById("pairTable").innerHTML = head + `<tbody>${body || `<tr><td colspan="${size + 3}" class="text-secondary">沒有符合篩選的組合</td></tr>`}</tbody>`;
}

function renderAttention(rows) {
  const list = title => {
    const found = rows.filter(row => row.tags.includes(title));
    return found.length ? found.map(row => numCell(row.number)).join(" ") : "（無）";
  };
  document.getElementById("attention").innerHTML =
    `<div class="alert alert-success py-2"><strong>近5熱（最新 5 期 ≥ 4）：</strong> ${list("近5熱")}</div>` +
    `<div class="alert alert-success py-2"><strong>潛力上升（30 期 4–5 次，近15期多過前15期，近5期仍有出現）：</strong> ${list("潛力上升")}</div>` +
    `<div class="alert alert-warning py-2"><strong>熱但近10未出：</strong> ${list("熱但近10未出")}</div>` +
    `<div class="alert alert-primary py-2"><strong>冷但回升：</strong> ${list("冷但回升")}</div>`;
}

function renderHeat(rows) {
  const visible = rows
    .filter(row => view === "all" || row.trendScore >= 0)
    .filter(row => temperatures.has(row.standard))
    .sort((a, b) => {
      if (sortKey === "number") return a.number - b.number;
      if (sortKey === "recent") return b.windows[0] - a.windows[0] || b.weight - a.weight || a.number - b.number;
      if (sortKey === "c30") return b.c30 - a.c30 || b.weight - a.weight || a.number - b.number;
      if (sortKey === "trendScore") return b.trendScore - a.trendScore || b.windows[0] - a.windows[0] || a.number - b.number;
      return b.weight - a.weight || b.windows[0] - a.windows[0] || a.number - b.number;
    });
  const head = `<thead><tr><th>號碼</th>${WINDOWS.map(window => `<th>${window.label}</th>`).join("")}` +
    `${th("30期", "c30")}<th>近15</th><th>前15</th><th>變化</th>${th("活躍度", "weight")}${th("趨勢分", "trendScore")}<th>距今</th><th>判斷</th></tr></thead>`;
  const body = visible.map(row => {
    const sign = row.change > 0 ? "+" : "";
    const direction = row.change > 0 ? "up" : row.change < 0 ? "down" : "";
    const trendSign = row.trendScore > 0 ? "+" : "";
    const trendDirection = row.trendScore > 0 ? "up" : row.trendScore < 0 ? "down" : "";
    const cells = row.windows.map(count => `<td class="${heatClass(count)}">${count}</td>`).join("");
    return `<tr data-row-number="${row.number}" class="${row.number === selected ? "selected-row" : ""}"><td>${numCell(row.number)}</td>${cells}<td class="${row.standard === "熱" ? "total-hot" : row.standard === "冷" ? "total-cold" : "total-normal"}">${row.c30}</td>` +
        `<td>${row.c15}</td><td>${row.prev}</td><td class="${direction}">${sign}${row.change}</td><td>${row.weight}</td><td class="${trendDirection}">${trendSign}${row.trendScore}</td><td>${row.gap}</td><td>${verdictFor(row)}</td></tr>`;
  }).join("");
      document.getElementById("heatTable").innerHTML = head + `<tbody>${body || '<tr><td colspan="15" class="text-secondary">沒有符合篩選的號碼</td></tr>'}</tbody>`;
}

function bandCounts(result) {
  const balls = ballsOf(result);
  return BANDS.map(band => balls.filter(number => number >= band.min && number <= band.max).length);
}

function renderBands() {
  const only30 = document.getElementById("only30").checked;
  const shown = only30 ? draws : full;
  const windowHead = WINDOWS.map(window => `<th>${window.label}</th>`).join("");
  let summary = `<div class="table-responsive"><table class="table table-sm table-bordered align-middle text-center mb-3"><thead><tr><th>區間</th><th>5期期望</th>${windowHead}<th>30期合計</th><th>30期期望</th><th>近5偏離</th></tr></thead><tbody>`;
  BANDS.forEach((band, bandIndex) => {
    const perWindow = WINDOWS.map(window => draws.slice(window.start, window.end)
      .reduce((sum, result) => sum + bandCounts(result)[bandIndex], 0));
    const total = perWindow.reduce((sum, count) => sum + count, 0);
    const cells = perWindow.map(count => `<td class="${bandClass(count)}">${count}</td>`).join("");
    const recentGap = (perWindow[0] - expectedBand(5, band)).toFixed(1);
    summary += `<tr><td>${band.label}</td><td>${expectedBand(5, band).toFixed(1)}</td>${cells}` +
      `<td>${total}</td><td>${expectedBand(draws.length, band).toFixed(1)}</td><td class="${recentGap > 0 ? "up" : recentGap < 0 ? "down" : ""}">${recentGap}</td></tr>`;
  });
  summary += "</tbody></table></div>";
  document.getElementById("bandSummary").innerHTML =
    `<p class="small text-secondary">1–40 每格期望 ${expectedBand(5, BANDS[0]).toFixed(1)}；41–49 只有 9 個號碼，期望 ${expectedBand(5, BANDS[4]).toFixed(1)}。五期區間次數：0–3 藍、4–6 黃、7–9 橙、10+ 紅。</p>` + summary;

  const head = `<thead><tr><th>#</th><th>Date</th><th colspan="6">Numbers</th><th>Special</th>${BANDS.map(band => `<th>${band.label}</th>`).join("")}</tr></thead>`;
  const body = shown.map((result, index) => {
    const counts = bandCounts(result);
    const outside = index >= 30 ? " dim" : "";
    const nums = result.numbers.map(number => `<td class="${outside.trim()}">${numCell(number)}</td>`).join("");
    const bands = counts.map(count => `<td class="${heatClass(count)}">${count}</td>`).join("");
    return `<tr class="${outside.trim()}"><td>${index}</td><td>${result.date}</td>${nums}<td>${numCell(result.special)}</td>${bands}</tr>`;
  }).join("");
  document.getElementById("bandTable").innerHTML = head + `<tbody>${body}</tbody>`;
}
</script>
</body>
